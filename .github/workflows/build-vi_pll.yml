name: build-vi_pll

# Builds the tools/ homebrew (vi_pll, vi720test) into boot.dol using the official devkitPro
# PowerPC toolchain container (GitHub's runners have the network access this needs). Results
# are uploaded as workflow artifacts AND force-pushed to the `vi-pll-dist` branch, so they
# can be retrieved with a plain `git fetch` even without the Actions artifact API.

on:
  push:
    branches: [ vi-pll-tool ]
    paths:
      - 'tools/vi_pll/**'
      - 'tools/vi720test/**'
      - '.github/workflows/build-vi_pll.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build tools
        run: |
          set -eux
          echo "DEVKITPRO=$DEVKITPRO  DEVKITPPC=$DEVKITPPC"
          powerpc-eabi-gcc --version | head -1
          for d in vi_pll vi720test; do
            if [ -f "tools/$d/Makefile" ]; then
              echo "=== building $d ==="
              make -C "tools/$d"
              ls -l "tools/$d/boot.dol"
            fi
          done

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dols
          path: |
            tools/vi_pll/boot.dol
            tools/vi720test/boot.dol

      - name: Publish boot.dol files to vi-pll-dist branch
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eux
          # Self-contained repo in a temp dir with an explicitly authenticated remote,
          # to avoid any safe.directory / orphan-checkout issues inside the container.
          PUB=/tmp/pub
          rm -rf "$PUB" && mkdir -p "$PUB/apps/vi_pll" "$PUB/apps/vi720test"
          cp tools/vi_pll/boot.dol    "$PUB/apps/vi_pll/boot.dol"
          cp tools/vi_pll/meta.xml    "$PUB/apps/vi_pll/meta.xml"
          cp tools/vi720test/boot.dol "$PUB/apps/vi720test/boot.dol"
          cp tools/vi720test/meta.xml "$PUB/apps/vi720test/meta.xml"
          echo "build $(date -u +%Y-%m-%dT%H:%M:%SZ) from commit ${GITHUB_SHA}" > "$PUB/BUILD_INFO.txt"
          cd "$PUB"
          git init -q
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "homebrew boot.dol build [skip ci]"
          git branch -M vi-pll-dist
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin vi-pll-dist
